# dsh-webseek bundle patch: inserts the dual-face plugin row into a profile
# roster (applied as a profile bundle layer via the `dsh.bundle.patch` manifest
# field). The node half (exports ".") runs in the Host process and serves the
# /api/dsh-webseek routes; the `dsh.client` declaration in package.json makes
# the browser half (exports "./client") load in the Web GUI as the sidebar tab
# type and its panel.
#
# `name` must be this package's manifest name verbatim — dsh-client-modules
# keys every browser row by it, and lib/client.js registers its factory under
# the same id. `id` is the profile entry id (also the settings-form namespace);
# it must be unique per profile.
- insert:
    - id: webseek
      name: 'dsh-webseek'
